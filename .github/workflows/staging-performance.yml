name: AYDA Staging Performance Checks
on:
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check assets/ayda-speed.js
          node --check assets/test-readonly.js
          node --check assets/app.js
          node --check assets/owner.js
          node --check assets/manager.js
      - name: Data, workflow and performance regressions
        run: |
          node --test tests/*.test.mjs
          node tests/smoke.js
