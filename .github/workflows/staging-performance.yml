name: AYDA Staging Performance Checks
on:
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check assets/ayda-speed.js
          node --check assets/test-readonly.js
          node --check assets/app.js
          node --check assets/owner.js
          node --check assets/manager.js
      - name: Staging performance and live UI contract checks
        run: |
          node --test tests/performance.test.mjs tests/staging-contract.test.mjs
          node tests/smoke.js
# Historical repository tests/data-integrity.test.mjs and flow-navigation.test.mjs
# have known outdated assertions on main and must be repaired separately.
