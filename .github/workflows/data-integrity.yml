name: AYDA Data Integrity Tests
on:
  push:
    branches: [main, ayda-v4-4-data-integrity-20261019]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check tests/data-integrity.test.mjs
          node --check assets/app.js
          node --check assets/owner.js
          node --check assets/owner-data-control.js
          node --check assets/teacher-daily.js
          cp apps-script/Code.gs /tmp/ayda-apps-script-check.js
          node --check /tmp/ayda-apps-script-check.js
      - name: Run isolated data regression tests
        run: node --test tests/*.test.mjs
