<!DOCTYPE html><html lang="tr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#18263d;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}header{background:#142744;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}header small{color:#d5bd82;letter-spacing:2px}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #e1e6ef;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 3px 16px #172a4210}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.muted{color:#67768c;font-size:13px}.pill{background:#f4e9d3;border-radius:99px;padding:5px 10px;font-size:12px}button{background:#142744;color:white;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:650}button:disabled{opacity:.5}button.alt{background:#edf1f6;color:#142744}input,select,textarea{display:block;width:100%;padding:11px;border:1px solid #ccd4df;border-radius:9px;font:inherit;margin:7px 0 13px}label{font-size:13px;font-weight:650}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.bar{height:8px;background:#e7ebf2;border-radius:9px;overflow:hidden;margin:10px 0}.bar>div{background:#c5a15c;height:100%}.hide{display:none!important}.notice{padding:12px;border-radius:10px;background:#e9f4ec;margin:10px 0}.error{background:#fff0f0;color:#a52828}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}h1,h2,h3{margin:6px 0 12px}h1{font-size:24px}h2{font-size:19px}h3{font-size:16px}.mini{font-size:12px}.login{max-width:420px;margin:8vh auto}.section{margin:22px 0}details{margin:8px 0}summary{cursor:pointer;font-weight:650}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px;border-bottom:1px solid #e9edf3;text-align:left}.scroll{overflow-x:auto}@media(max-width:600px){main{margin:12px auto}.card{padding:15px}header{padding:14px}h1{font-size:20px}}
</style></head><body><header><div><small>AYDA DİL AKADEMİSİ</small><div style="font-weight:750;font-size:18px">Akademik Takip</div></div><div id="userLabel"></div></header><main><div id="alert"></div><div id="login" class="card login"><h1>Giriş Yap</h1><p class="muted">Öğretmen ve yönetici giriş ekranı</p><form id="loginForm"><label>Kullanıcı adı<input id="username" autocomplete="username" required></label><label>6 haneli PIN<input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label><button type="submit">Giriş yap</button></form></div><div id="app" class="hide"><div class="line"><h1 id="hello"></h1><button class="alt" onclick="signOut()">Çıkış</button></div><nav><button onclick="showTab('today')">Derslerim</button><button onclick="showTab('groups')" class="alt">Gruplar</button><button onclick="showTab('private')" class="alt">Özel Ders</button><button id="adminTab" onclick="showTab('admin')" class="alt">Yönetim</button></nav><div id="today"></div><div id="groups" class="hide"></div><div id="private" class="hide"></div><div id="admin" class="hide"></div></div></main>
<script>
let token=sessionStorage.getItem('aydaToken')||'',state=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const dow=date=>{let d=new Date(date+'T12:00:00').getDay();return d===0?7:d};const weekdays=['','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];function call(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args))}function notify(m,err=false){$('alert').innerHTML='<div class="notice '+(err?'error':'')+'">'+esc(m)+'</div>';setTimeout(()=>$('alert').innerHTML='',5500)}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{const r=await call('login',$('username').value,$('pin').value);token=r.token;sessionStorage.setItem('aydaToken',token);await refresh()}catch(e){notify(e.message,true)}});
async function refresh(){try{state=await call('dashboard',token);$('login').classList.add('hide');$('app').classList.remove('hide');$('hello').textContent='Merhaba, '+state.user.name;$('userLabel').textContent=state.user.role==='admin'?'Yönetici':'Öğretmen';$('adminTab').classList.toggle('hide',state.user.role!=='admin');render();showTab('today')}catch(e){signOut();notify(e.message,true)}}function signOut(){if(token)call('logout',token).catch(()=>{});token='';sessionStorage.removeItem('aydaToken');$('login').classList.remove('hide');$('app').classList.add('hide');$('userLabel').textContent=''}function showTab(id){['today','groups','private','admin'].forEach(k=>$(k).classList.toggle('hide',k!==id))}function group(id){return state.groups.find(g=>g.id===id)||{name:id}}function teacher(id){return state.teachers.find(t=>t.id===id)?.name||id||'Atanmadı'}function done(s,date){return state.lessons.find(l=>l.schedule_id===s.id&&l.date===date)}
function render(){const d=today(),weekday=dow(d),todaySchedules=state.schedules.filter(s=>Number(s.weekday)===weekday&&String(s.active).toLowerCase()!=='false');$('today').innerHTML='<div class="card"><h2>Bugünkü Dersler · '+esc(d)+'</h2><p class="muted">Programda görünen derslerin raporlarını kaydedin.</p></div>'+(todaySchedules.length?todaySchedules.map(s=>{const l=done(s,d);return `<div class="card"><div class="line"><h3>${esc(group(s.group_id).name)}</h3><span class="pill">${l?esc(l.status):'Rapor bekliyor'}</span></div><p class="muted">${esc(s.start_time)}–${esc(s.end_time)} · ${esc(s.units)} grup ders saati</p>${l?`<p>${esc(l.topic||'Kayıt yapıldı')}</p>`:`<button onclick="openReport('${esc(s.id)}','${d}')">Ders raporu doldur</button>`}</div>`}).join(''):'<div class="card">Bugün için tanımlanmış ders bulunmuyor.</div>')+'<div id="reportArea"></div>';
$('groups').innerHTML='<h2>Gruplar</h2><div class="grid">'+state.groups.map(g=>{const has=g.completed_unit!==''&&g.completed_unit!==null,done=has?Number(g.completed_unit):0,total=Number(g.total_units)||24;return `<div class="card"><h3>${esc(g.name)}</h3><p class="muted">${esc(g.level)} · ${esc(g.teacher_id)} · ${esc(g.students)} öğrenci</p><div class="bar"><div style="width:${100*done/total}%"></div></div><p class="mini">${has?'Tamamlanan '+done+' / '+total+' · Kalan '+(total-done):'Ünite bilgisi henüz girilmedi'}</p><p class="muted">${esc(g.start_date)} → ${esc(g.end_date)}</p></div>`}).join('')+'</div>';
$('private').innerHTML='<h2>Özel Dersler</h2>'+(state.students.length?state.students.map(s=>{const used=state.privates.filter(l=>l.student_id===s.id).reduce((a,l)=>a+Number(l.units),0);return `<div class="card"><h3>${esc(s.name)}</h3><p>${Number(s.purchased_units)-used} / ${s.purchased_units} ders saati kaldı</p><p class="muted">1 özel ders saati = 50 dakika</p><button onclick="openPrivate('${esc(s.id)}')">Ders kaydet</button><div id="p-${esc(s.id)}"></div></div>`}).join(''):'<div class="card">Henüz özel ders öğrencisi eklenmedi.</div>');
if(state.user.role==='admin')$('admin').innerHTML=`<h2>Yönetim</h2><div class="grid"><div class="card"><h3>${state.groups.length}</h3><p>Grup</p></div><div class="card"><h3>${state.lessons.length}</h3><p>Kaydedilen grup dersi</p></div><div class="card"><h3>${state.students.length}</h3><p>Özel ders öğrencisi</p></div></div><div class="card"><h3>Grup ünite başlangıç değeri</h3><form id="unitForm"><label>Grup<select name="group_id">${state.groups.map(g=>`<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('')}</select></label><label>Son tamamlanan ünite<input name="unit" type="number" min="0" max="24" required></label><button>Kaydet</button></form></div><div class="card"><h3>Haftalık ders ekle</h3><form id="scheduleForm"><label>Grup<select name="group_id">${state.groups.map(g=>`<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('')}</select></label><label>Öğretmen<select name="teacher_id">${state.teachers.filter(t=>t.role==='teacher').map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select></label><label>Gün<select name="weekday">${weekdays.slice(1).map((d,i)=>`<option value="${i+1}">${d}</option>`).join('')}</select></label><div class="grid"><label>Başlangıç<input type="time" name="start_time" value="20:00" required></label><label>Bitiş<input type="time" name="end_time" value="21:30" required></label></div><label>Grup ders saati sayısı (40 dk)<input type="number" name="units" min="1" max="12" value="2" required></label><button>Program ekle</button></form></div><div class="card"><h3>Özel ders öğrencisi ekle</h3><form id="studentForm"><label>Öğrenci adı<input name="name" required></label><label>Öğretmen<select name="teacher_id">${state.teachers.filter(t=>t.role==='teacher').map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select></label><label>Satın alınan ders saati (50 dk)<input type="number" name="purchased_units" min="0" required></label><button>Öğrenci ekle</button></form></div><div class="card"><h3>Haftalık program</h3><div class="scroll"><table><tr><th>Grup</th><th>Öğretmen</th><th>Gün</th><th>Saat</th><th>Ders saati</th></tr>${state.schedules.map(s=>`<tr><td>${esc(group(s.group_id).name)}</td><td>${esc(teacher(s.teacher_id))}</td><td>${esc(weekdays[s.weekday])}</td><td>${esc(s.start_time)}–${esc(s.end_time)}</td><td>${esc(s.units)}</td></tr>`).join('')}</table></div></div>`;
if(state.user.role==='admin'){bind('unitForm','setGroupUnit',v=>[v.group_id,Number(v.unit)]);bind('scheduleForm','saveSchedule',v=>[v]);bind('studentForm','addPrivateStudent',v=>[v]);}}
function bind(id,method,convert){$(id).addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const v=Object.fromEntries(new FormData(e.target));await call(method,token,...convert(v));notify('Kayıt başarıyla yapıldı.');await refresh();showTab('admin')}catch(err){notify(err.message,true)}finally{b.disabled=false}})}
function openReport(id,date){const s=state.schedules.find(x=>x.id===id),g=group(s.group_id);$('reportArea').innerHTML=`<div class="card"><h3>${esc(g.name)} · Ders raporu</h3><form id="reportForm"><label>Tarih<input type="date" name="date" value="${date}" required></label><label>Durum<select name="status"><option value="completed">Ders yapıldı</option><option value="cancelled">Ders iptal edildi</option></select></label><label>Son tamamlanan ünite (boş bırakılabilir)<input type="number" min="0" max="${esc(g.total_units)}" name="completed_unit" placeholder="Henüz bilinmiyor"></label><label>İşlenen konu<input name="topic" maxlength="250"></label><label>Not<textarea name="note" maxlength="500"></textarea></label><button>Kaydı gönder</button></form></div>`;$('reportForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await call('reportLesson',token,{...Object.fromEntries(new FormData(e.target)),schedule_id:id});notify('Ders raporu kaydedildi.');await refresh()}catch(err){notify(err.message,true)}finally{b.disabled=false}};$('reportArea').scrollIntoView({behavior:'smooth'})}
function openPrivate(id){$('p-'+id).innerHTML=`<form id="privateForm"><label>Tarih<input type="date" name="date" value="${today()}" required></label><label>Ders saati sayısı (50 dk)<input type="number" name="units" value="1" min="1" max="12" required></label><label>Konu<input name="topic" required></label><label>Not<textarea name="note"></textarea></label><button>Özel dersi kaydet</button></form>`;$('privateForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await call('reportPrivate',token,{...Object.fromEntries(new FormData(e.target)),student_id:id});notify('Özel ders kaydedildi.');await refresh();showTab('private')}catch(err){notify(err.message,true)}finally{b.disabled=false}}}
if(token)refresh();
</script></body></html>
