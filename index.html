<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AYDA Akademik Takip</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#15243e;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#112744;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}header b{color:#e4bd6a}main{max-width:1050px;margin:25px auto;padding:0 16px}.card{background:white;border:1px solid #e0e6ee;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 3px 10px #162e4910}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.muted{color:#63748a;font-size:13px}.pill{display:inline-block;background:#f2e9d3;border-radius:30px;padding:5px 10px;font-size:12px}input,select,textarea,button{font:inherit;padding:12px;border-radius:9px}input,select,textarea{border:1px solid #cdd5e1;width:100%;margin:6px 0 12px}button{border:0;background:#183d68;color:white;cursor:pointer}button:disabled{opacity:.5}button.alt{background:#e8edf3;color:#173454}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.hidden{display:none}.error{color:#a52b35}.success{color:#18744b}.bar{height:8px;background:#e9edf2;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:#c5a45f}h1{font-size:25px}h2{font-size:19px}label{font-size:13px;font-weight:600}textarea{min-height:65px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px;border-bottom:1px solid #e6eaf0}small{font-size:12px}
</style></head><body><header><div><b>AYDA</b> · Akademik Takip</div><button id="logout" class="alt hidden">Çıkış</button></header><main><section id="setup" class="card hidden"><h2>Bağlantı gerekli</h2><p>config.js dosyasına Supabase proje adresi ve publishable key eklenmelidir.</p></section><section id="login" class="card hidden"><h1>Öğretmen / Yönetici Girişi</h1><form id="loginForm"><label>E-posta</label><input type="email" id="email" required autocomplete="email"><label>Şifre</label><input type="password" id="password" required autocomplete="current-password"><button>Giriş yap</button></form></section><section id="app" class="hidden"><div class="row"><div><h1 id="welcome">Derslerim</h1><p id="role" class="muted"></p></div><button id="refresh" class="alt">Yenile</button></div><div id="stats" class="grid"></div><h2>Gruplar</h2><div id="groups" class="grid"></div><h2>Planlanan dersler</h2><div id="lessons"></div><h2>Özel dersler</h2><div id="privates"></div><div id="admin" class="hidden"><h2>Yönetici · Yeni grup</h2><form id="groupForm" class="card"><label>Grup adı</label><input name="name" required><label>Seviye</label><select name="level"><option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option></select><label>Öğretmen</label><select id="teacher" name="teacher_id"><option value="">Henüz atanmadı</option></select><label>Öğrenci sayısı</label><input name="student_count" type="number" min="0"><label>Başlangıç</label><input name="start_date" type="date"><label>Bitiş</label><input name="end_date" type="date"><label>Toplam ünite</label><input name="total_units" type="number" min="1" value="24" required><button>Grubu ekle</button></form><h2>Yönetici · Ders planla</h2><form id="scheduleForm" class="card"><label>Grup</label><select id="groupSelect" name="group_id" required></select><label>Tarih ve başlangıç saati</label><input type="datetime-local" name="start" required><label>Bitiş saati</label><input type="datetime-local" name="end" required><button>Dersi programa ekle</button></form></div></section><p id="msg" aria-live="polite"></p></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="app.js"></script></body></html>
